openapi: 3.1.0
info:
  title: Deck-less Pitch - Save Vendor Recommendation Ranking
  version: 1.0.0
  description: >-
    Replaces a buyer's vendor recommendation ranking with a new ranked list,
    highest fit score first.
servers:
  - url: https://rrtmvsfpzurafzycjboz.supabase.co
paths:
  /functions/v1/save-vendor-recommendation-ranking:
    post:
      operationId: saveVendorRecommendationRanking
      summary: Save a buyer's ranked vendor recommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - buyerId
                - rankings
              properties:
                buyerId:
                  type: string
                  format: uuid
                  description: >-
                    The buyer this ranking belongs to. Must be a real buyer id
                    already on file (e.g. from 'Capture Initial Requirement
                    Summary') -- an invented id causes a 404.
                  example: "666fdd3d-b722-4e2a-b9d1-f21f1f0a3ab8"
                rankings:
                  type: array
                  minItems: 1
                  description: >-
                    One entry per recommended vendor. Existing rankings for
                    this buyer are replaced. Every vendorId must be a real
                    vendor id already on file -- an invented id violates the
                    foreign key and the call fails with a 500.
                  example:
                    - vendorId: "9a0d1c12-64d9-48cf-83df-6040b379918c"
                      fitScore: 88
                      keyMatch: "SaaS redesign"
                      reason: "Strong match to the UI/UX redesign requirement."
                      confidence: 0.9
                  items:
                    type: object
                    required:
                      - vendorId
                    properties:
                      vendorId:
                        type: string
                        format: uuid
                        description: >-
                          The vendor being ranked -- a real vendor id already
                          on file. Entries without a vendorId are skipped;
                          entries with a vendorId that does not exist cause
                          the whole save to fail with a 500.
                      fitScore:
                        type: number
                        description: Overall fit score out of 100.
                      keyMatch:
                        type: string
                      reason:
                        type: string
                      confidence:
                        type: number
                      evidence:
                        type: object
                        description: Free-form evidence payload supporting this ranking.
      responses:
        "200":
          description: The ranking was saved.
          content:
            application/json:
              schema:
                type: object
                required:
                  - buyerId
                  - savedCount
                  - recommendations
                properties:
                  buyerId:
                    type: string
                    format: uuid
                  savedCount:
                    type: integer
                  recommendations:
                    type: array
                    description: The saved recommendations, ordered by fit_score descending.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        vendor_id:
                          type: string
                          format: uuid
                        fit_score:
                          type:
                            - number
                            - "null"
                        key_match:
                          type:
                            - string
                            - "null"
                        reason:
                          type:
                            - string
                            - "null"
                        confidence:
                          type:
                            - number
                            - "null"
        "400":
          description: The request body was not valid JSON, buyerId was not supplied, or no ranking entry had a vendorId.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: No buyer exists for the supplied buyerId.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "405":
          description: The request method is not supported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: The ranking could not be saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "503":
          description: Server storage is not configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
