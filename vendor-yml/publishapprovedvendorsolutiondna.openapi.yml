openapi: 3.1.0
info:
  title: Deck-less Pitch - Publish Approved Vendor Solution DNA
  version: 1.0.0
  description: >-
    Records the vendor's per-capability approval decision and publishes the
    approved capabilities so they become visible to buyers.
servers:
  - url: https://rrtmvsfpzurafzycjboz.supabase.co
paths:
  /functions/v1/publish-approved-vendor-solution-dna:
    post:
      operationId: publishApprovedVendorSolutionDna
      summary: Apply the vendor's approval decisions and publish the approved capabilities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vendorId
                - decisions
              properties:
                vendorId:
                  type: string
                  format: uuid
                  description: The vendor whose draft capabilities are being decided on.
                  example: "11111111-1111-1111-1111-111111111111"
                decisions:
                  type: array
                  minItems: 1
                  description: One decision per capability the vendor reviewed.
                  example:
                    - capabilityId: "22222222-2222-2222-2222-222222222222"
                      verificationStatus: verified
                  items:
                    type: object
                    required:
                      - capabilityId
                      - verificationStatus
                    properties:
                      capabilityId:
                        type: string
                        format: uuid
                        description: The capability this decision applies to.
                      verificationStatus:
                        type: string
                        enum:
                          - verified
                          - modelled
                          - unverified
                          - pending
                        description: >-
                          The vendor's final decision. verified or modelled
                          publishes the capability; unverified or pending
                          keeps it saved but unpublished.
                      description:
                        type: string
                        description: Vendor-revised capability text, if edited during approval.
      responses:
        "200":
          description: The approval decisions were applied and approved capabilities were published.
          content:
            application/json:
              schema:
                type: object
                required:
                  - vendorId
                  - publishedCapabilityIds
                  - unpublishedCapabilityIds
                  - publishedAt
                properties:
                  vendorId:
                    type: string
                    format: uuid
                  publishedCapabilityIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                    description: Capabilities now verified or modelled and visible to buyers.
                  unpublishedCapabilityIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                    description: Capabilities marked unverified or pending; saved but not published.
                  vendorVerificationStatus:
                    type:
                      - string
                      - "null"
                    enum:
                      - verified
                      - modelled
                      - null
                    description: The vendor's overall status after this publish, if any capability was published.
                  publishedAt:
                    type: string
                    format: date-time
        "400":
          description: One or more required request fields were not supplied or were invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: No vendor, or no capability belonging to that vendor, exists for the supplied id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "405":
          description: The request method is not supported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "500":
          description: The approval decisions could not be applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "503":
          description: Server storage is not configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
